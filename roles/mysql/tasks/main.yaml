- name: enable enable mysql:8.4
  command: dnf module enable mysql:8.4 -y

- name: install mysql server
  package:
    name: mysql-server
    state: present

- name: enable and start mysql
  service:
    name: mysqld
    state: started
    enabled: yes

- name: Install boto3 and botocore via pip
  ansible.builtin.pip:
    name:
      - boto3
      - botocore
    state: present
    executable: pip3.9

- name: setup mysql root password
  command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"